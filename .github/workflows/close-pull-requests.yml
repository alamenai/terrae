name: Close Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `Thank you for your interest in contributing to Terrae! 🗺️

            This project is open source but **does not accept pull requests**. We maintain the codebase internally to ensure consistency and quality.

            **How you can contribute:**
            - 🐛 Report bugs by opening an issue
            - 💡 Suggest features or improvements via issues
            - 📖 Share feedback on existing components

            Please open an issue instead to discuss your idea, and we'll be happy to consider it!`
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
